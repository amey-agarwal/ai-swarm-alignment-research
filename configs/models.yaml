# Model registry (CLAUDE.md §9). All bf16.
# Before downloading: verify each Hugging Face ID and licence, accept gated licences
# (Llama, Gemma), and pin `revision` to a commit SHA. Cluster runs with vLLM refuse a
# swarm or judge model whose revision is not pinned (pass 1, `models` check).
#
# Download EXACTLY the pinned revision into $SWARM_WEIGHTS/<hf_id> (on a login/transfer node,
# never inside a run), e.g.:
#   huggingface-cli download meta-llama/Llama-3.2-3B-Instruct \
#     --revision 0cb88a4f764b7a12671c53f0838cd831a0843b95 \
#     --local-dir "$SWARM_WEIGHTS/meta-llama/Llama-3.2-3B-Instruct"
#   huggingface-cli download google/gemma-3-27b-it \
#     --revision 005ad3404e59d6023443cb575daa05336842228a \
#     --local-dir "$SWARM_WEIGHTS/google/gemma-3-27b-it"
#
# Pinned SHAs = Hugging Face `main` as of 2026-11-08 (Llama-3.2-3B-Instruct last modified
# 2024-10-24; gemma-3-27b-it last modified 2025-03-21). Checked against vllm==0.8.5.post1:
# LlamaForCausalLM and Gemma3ForConditionalGeneration (text-only) are supported, and
# response_format=json_schema maps to guided JSON decoding.

models:
  llama-3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    role: swarm
    params_b: 3.2
    license: llama3.2
    gated: true
    revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
    ollama_tag: "llama3.2:3b"   # local exploratory mode only (Q4 quantized, not bf16)
  phi-4-mini:
    hf_id: microsoft/Phi-4-mini-instruct
    role: swarm
    params_b: 3.8
    license: mit
    gated: false
  llama-3.1-8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    role: swarm
    params_b: 8.0
    license: llama3.1
    gated: true
  gemma-3-12b:
    hf_id: google/gemma-3-12b-it
    role: swarm
    params_b: 12.0
    license: gemma
    gated: true

  # optional
  llama-3.2-1b:
    hf_id: meta-llama/Llama-3.2-1B-Instruct
    role: swarm
    params_b: 1.2
    license: llama3.2
    gated: true
    optional: true
  mistral-7b:
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    role: swarm
    params_b: 7.2
    license: apache-2.0
    gated: false
    optional: true
  phi-4:
    hf_id: microsoft/phi-4
    role: swarm
    params_b: 14.7
    license: mit
    gated: false
    optional: true

  # judge (80 GB GPU); must differ in family from the swarm model under test
  gemma-3-27b:
    hf_id: google/gemma-3-27b-it
    role: judge
    params_b: 27.0
    license: gemma
    gated: true
    revision: 005ad3404e59d6023443cb575daa05336842228a

  # ---------------------------------------------------------------- API track (OpenRouter)
  # Fill in BEFORE running (pass 1 refuses CHANGEME). openrouter_id is the exact OpenRouter slug
  # <org>/<model> with NO ":" variant (":online" adds web search, a tool); hf_id must equal it.
  # providers: the OpenRouter provider slug(s) allowed to serve it (pinned; fallbacks are always
  # off; require_parameters=true, so the provider must honour seed + JSON schema). No Qwen/DeepSeek
  # models or providers. params_b is left out: unknown for API models (excluded from scaling plots).
  # Providers chosen 2026-11-09 from openrouter.ai/api/v1/models/<id>/endpoints: bf16 endpoints that
  # list structured_outputs (strict JSON schema) and seed. Re-check if a run reports "no endpoints".
  api-model-a:
    hf_id: meta-llama/llama-3.1-8b-instruct
    openrouter_id: meta-llama/llama-3.1-8b-instruct
    providers: [coreweave/bf16]
    role: swarm
    license: provider-terms
    gated: false
  api-model-b:
    hf_id: meta-llama/llama-3.2-3b-instruct
    openrouter_id: meta-llama/llama-3.2-3b-instruct
    providers: [parasail/bf16]
    role: swarm
    license: provider-terms
    gated: false
