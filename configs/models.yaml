# Model registry (CLAUDE.md §9). All bf16.
# Before downloading: verify each Hugging Face ID and licence, accept gated licences
# (Llama, Gemma), and pin `revision` to a commit SHA.

models:
  llama-3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    role: swarm
    params_b: 3.2
    license: llama3.2
    gated: true
    ollama_tag: "llama3.2:3b"   # local exploratory mode only (Q4 quantized, not bf16)
  phi-4-mini:
    hf_id: microsoft/Phi-4-mini-instruct
    role: swarm
    params_b: 3.8
    license: mit
    gated: false
  llama-3.1-8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    role: swarm
    params_b: 8.0
    license: llama3.1
    gated: true
  gemma-3-12b:
    hf_id: google/gemma-3-12b-it
    role: swarm
    params_b: 12.0
    license: gemma
    gated: true

  # optional
  llama-3.2-1b:
    hf_id: meta-llama/Llama-3.2-1B-Instruct
    role: swarm
    params_b: 1.2
    license: llama3.2
    gated: true
    optional: true
  mistral-7b:
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    role: swarm
    params_b: 7.2
    license: apache-2.0
    gated: false
    optional: true
  phi-4:
    hf_id: microsoft/phi-4
    role: swarm
    params_b: 14.7
    license: mit
    gated: false
    optional: true

  # judge (80 GB GPU); must differ in family from the swarm model under test
  gemma-3-27b:
    hf_id: google/gemma-3-27b-it
    role: judge
    params_b: 27.0
    license: gemma
    gated: true
